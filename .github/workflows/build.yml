name: Build & Publish Latest Executable

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 requests Pillow pywin32 jsonschema google-api-python-client google-auth-httplib2 google-auth-oauthlib psutil

    - name: Write Commit SHA
      run: |
        echo ${{ github.sha }} > commit.txt

    - name: Build Executable with PyInstaller
      run: |
        python build.py

    - name: Prepare Release Asset
      run: |
        copy "dist\iMA Switcher Installer.exe" "dist\iMA.Switcher.Installer.exe"
        echo ${{ github.sha }} > dist\commit.txt

    - name: Extract Version Tag
      id: get_version
      run: |
        $VER = (python -c "from game_switcher import APP_VERSION; print(APP_VERSION)").Trim()
        echo "TAG_NAME=v$VER" >> $env:GITHUB_OUTPUT
        echo "Detected APP_VERSION: $VER, Setting Tag: v$VER"

    - name: Release Executable
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
        name: Release ${{ steps.get_version.outputs.TAG_NAME }}
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: true
        files: |
          dist/iMA.Switcher.Installer.exe
          dist/commit.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
